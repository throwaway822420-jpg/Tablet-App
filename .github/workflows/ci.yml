name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Slate.sln -c Release -warnaserror
      - run: dotnet test Slate.Core.Tests -c Release --no-build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease lintDebug
      - name: Termux bridge test (fake Claude Code)
        run: node termux-test/bridge-test.js
      - uses: actions/upload-artifact@v4
        with:
          name: slate-apk
          path: android/app/build/outputs/apk/release/app-release.apk
